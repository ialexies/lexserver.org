limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Visitors arrive through Cloudflare, so the real address is in CF-Connecting-IP.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_ip zone=contact:10m rate=6r/m;

# Pages are pre-rendered HTML that point at hashed /assets/ files, so HTML must revalidate.
map $sent_http_content_type $cache_control {
    ~^text/html "no-cache";
    default     "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    limit_req zone=general burst=60 nodelay;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    add_header Cache-Control             $cache_control                                 always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://aiteampreview.lexserver.org https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Pre-rendered pages: /work is served from work.html, /blog/<slug> from blog/<slug>.html.
    # Folders with their own index.html (/indexwise/) still redirect to the slash form.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # A trailing slash on a pre-rendered page (/work/) redirects to the canonical URL.
    location ~ ^(.+)/$ {
        try_files ${uri}index.html @strip_slash;
    }

    location @strip_slash {
        rewrite ^(.+)/$ $1 permanent;
    }

    # Contact form backend (the "api" service in docker-compose.yml). Resolved per request
    # through Docker's DNS so nginx still starts if the api container is down.
    location /api/ {
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control          "no-store" always;
        add_header X-Content-Type-Options "nosniff"  always;
    }

    location = /api/health {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        add_header Cache-Control "no-store" always;
    }

    error_page 404 /404.html;

    location /assets/ {
        add_header Cache-Control             "public, max-age=31536000, immutable"          always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://aiteampreview.lexserver.org https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }
}
